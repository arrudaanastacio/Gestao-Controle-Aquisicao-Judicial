<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elo · Acesso</title>
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="pagina-login">
  <div class="cartao-login">
    <div class="selo-login" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="58" height="58" fill="none">
        <line x1="14" y1="16" x2="34" y2="16" stroke="#8bbfa9" stroke-width="2.8"/>
        <line x1="14" y1="16" x2="24" y2="34" stroke="#8bbfa9" stroke-width="2.8"/>
        <line x1="34" y1="16" x2="24" y2="34" stroke="#8bbfa9" stroke-width="2.8"/>
        <circle cx="14" cy="16" r="5.6" fill="#2f6f57"/>
        <circle cx="34" cy="16" r="5.6" fill="#2f6f57"/>
        <circle cx="24" cy="34" r="5.6" fill="#1f4c3c"/>
      </svg>
    </div>
    <p class="eyebrow-login">Gestão de Medicamentos Judiciais</p>
    <h1 class="marca-wordmark">Elo</h1>
    <p class="subtitulo-login">Entre Compras, Estoque e Demanda</p>

    <form id="formLogin" novalidate>
      <label for="email">E-mail</label>
      <input type="text" id="email" name="email" autocomplete="off" autofocus>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="off">

      <button type="button" id="botaoEntrar">Entrar</button>
      <p class="erro-login" id="erroLogin" role="alert" hidden></p>
    </form>
  </div>

  <script>
    // Faixa "HOMOLOGAÇÃO": só acende quando o servidor está em NODE_ENV=homologacao.
    (function () {
      fetch('/api/ambiente').then(function (r) { return r.json(); }).then(function (d) {
        if (!d || d.ambiente !== 'homologacao') return;
        var f = document.createElement('div');
        f.id = 'faixaAmbiente';
        f.textContent = '⚠ AMBIENTE DE HOMOLOGAÇÃO (TESTE) v' + (d.versao || '—') + ' — porta 3001 · nada aqui afeta a produção';
        document.body.appendChild(f);
        document.body.classList.add('tem-faixa-ambiente');
      }).catch(function () {});
    })();
  </script>

  <script>
    (function () {
      var botao = document.getElementById('botaoEntrar');
      var campoEmail = document.getElementById('email');
      var campoSenha = document.getElementById('senha');
      var erroEl = document.getElementById('erroLogin');

      function mostrarErro(msg) {
        erroEl.textContent = msg;
        erroEl.hidden = false;
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }

      var enviando = false;
      function entrar() {
        if (enviando) return; // evita envio duplicado
        var email = campoEmail.value.trim();
        var senha = campoSenha.value;

        if (!email || !senha) {
          mostrarErro('Preencha o e-mail e a senha.');
          return;
        }

        enviando = true;
        erroEl.hidden = true;
        botao.disabled = true;
        botao.textContent = 'Entrando…';

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, senha: senha })
        })
        .then(function (resp) {
          return resp.json().then(function (dados) {
            if (!resp.ok) {
              enviando = false;
              mostrarErro(dados.erro || 'Erro ao entrar.');
              return;
            }
            window.location.href = '/index.html';
          });
        })
        .catch(function () {
          enviando = false;
          mostrarErro('Não foi possível conectar ao servidor.');
        });
      }

      botao.addEventListener('click', entrar);
      campoEmail.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') campoSenha.focus(); });
      campoSenha.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') entrar(); });
    })();
  </script>
</body>
</html>
